 for(let i=0;i<n;i++){x.beginPath();x.moveTo(0,0);x.arc(0,0,146,KW.rot+i*sg,KW.rot+(i+1)*sg);x.closePath();x.fillStyle=`hsl(${210+i*(150/n)},55%,${dk?30:88}%)`;x.fill();x.strokeStyle=dk?'#1f232b':'#fff';x.lineWidth=2;x.stroke();x.save();x.rotate(KW.rot+(i+.5)*sg);x.fillStyle=dk?'#eceff4':'#1f2430';x.font='bold 14px sans-serif';x.textAlign='right';x.fillText(L[i].n,130,5);x.restore()}x.restore()}
const cur=()=>{const n=cds().length;return Math.floor(((((1.5*Math.PI-KW.rot)%TP)+TP)%TP)/(TP/n))}
function spin(){if(KW.sp||!cds().length)return;speechSynthesis.cancel();KW.sp=1;KW.cur=null;const b=$('[data-a=spin]');b.disabled=true;$('#res').innerHTML=resH();const t0=performance.now(),D=4200,r0=KW.rot,tot=(5+Math.random()*3)*TP+Math.random()*TP;let last=-1;
 const f=t=>{const p=Math.min(1,(t-t0)/D);KW.rot=r0+tot*(1-Math.pow(1-p,3));const k=cur();if(k!=last){last=k;tick(600+(k%5)*60)}drawWheel();if(p<1)requestAnimationFrame(f);else{KW.sp=0;KW.cur=cds()[k];tick(1100);render();say(KW.cur.jp)}};requestAnimationFrame(f)}
function resH(){const c=KW.cur;if(KW.sp)return'<div class="card soft" style="text-align:center">Berputar… 🎶</div>';if(!c)return'<div class="card soft" style="text-align:center">Putar rodanya, lalu dengarkan can-do yang keluar 🎧</div>';
 return`<div class=card><div class=soft>Can-do No.${c.n} · Bab ${c.b}</div><div class=row style="margin:8px 0"><button data-a=csay>🔊 Ulang</button><button data-a=csay data-v=slow>🐢 Pelan</button></div>${chk('jp','Tampilkan teks Jepang','k',KW)}${chk('id','Tampilkan arti Indonesia','k',KW)}${chk('ex','Tampilkan penjelasan (dialog contoh)','k',KW)}${KW.jp?`<p class=jp>${E(c.jp)}</p>`:''}${KW.id?`<p>${E(c.id)}</p>`:''}${!KW.jp&&!KW.id?'<p class=soft>🎧 Dengarkan dulu… teks disembunyikan.</p>':''}${KW.ex?`<div class=ex><div class=row><b>Dialog contoh</b><button style="flex:0;white-space:nowrap" data-a=all>▶ Putar semua</button></div>${c.d.map(([s,t],i)=>`<div class="ln" id=ln${i}><b class=sp>${s}</b><span class=tx>${E(t)}</span><button data-a=ls data-v=${i}>🔊</button><button data-a=mic data-v=${i}>🎤</button><button data-a=j data-v="${i}g">✓</button><button data-a=j data-v="${i}r">✗</button></div><div class=fb id=fb${i}></div>`).join('')}<p class=soft>Bareng teman: bagi peran A/B, ucapkan baris kamu lalu tekan 🎤 untuk dicek (atau nilai manual ✓/✗).</p></div>`:''}</div>`}
const renderRes=()=>{const r=$('#res');if(r)r.innerHTML=resH()};
async function playAll(){speechSynthesis.cancel();for(const[s,t]of KW.cur.d)await say(t,{keep:1,pitch:s=='B'?1.3:1})}
const nm=s=>s.replace(/[、。？！…「」\s・,.?!~～]/g,'');
function sim(a,b){a=nm(a);b=nm(b);const m=a.length,n=b.length;if(!n)return 0;let d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return Math.max(0,Math.round(100*(1-d[m][n]/Math.max(m,n))))}
function mic(i){const f=$('#fb'+i),SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){f.textContent='Mikrofon tidak didukung di sini — nilai manual dengan ✓/✗.';return}const r=new SR();r.lang='ja-JP';f.textContent='🎤 Bicara sekarang…';r.onresult=e=>{const h=e.results[0][0].transcript,s=sim(h,KW.cur.d[i][1]);$('#ln'+i).className='ln '+(s>=70?'g':'r');f.innerHTML=`Terdengar: ${E(h)} — <b>${s}%</b> ${s>=70?'✅ bagus':'🔁 coba lagi'}`};r.onerror=()=>f.textContent='Mik gagal / izin ditolak — pakai ✓/✗.';try{r.start()}catch(e){}}
/* ---------- KUIS KAIWA ---------- */
const dl=c=>c.d.slice(0,2).map(([s,t])=>s+': '+E(t)).join('<br>');
function vQ(){if(!QQ.on)return`<div class=card><h3>Kuis Kaiwa (Bab 13–18)</h3><div class=g2>${sel('wf',rg(13,18),'Dari bab')}${sel('wt',rg(13,18),'Sampai bab')}${sel('qd',[['mix','Campur (tersulit)'],['a','Can-do → tebak dialog'],['b','Dialog → tebak can-do'],['c','Dengar can-do → tebak dialog']],'Jenis soal')}${sel('qlv',[[1,'Mudah (3 opsi)'],[2,'Sedang (4 opsi)'],[3,'Sulit (5 opsi + 20 dtk)']],'Kesulitan')}${sel('qn',[[5,'5 soal'],[10,'10 soal'],[16,'Semua']],'Jumlah')}${sel('rate',[[.6,'Pelan'],[.9,'Normal'],[1.1,'Cepat']],'Kecepatan suara')}</div>${chk('qid','Tampilkan arti Indonesia')}<button class=pri data-a=startQ>Mulai kuis</button></div>`;
 if(QQ.end)return`<div class="card big"><b>${QQ.s} / ${QQ.q.length}</b><small>${QQ.s/QQ.q.length>=.8?'Hebat!':'Ulangi lagi untuk menghafal dialognya'}</small></div><button class=pri data-a=quitQ>Kembali</button>`;
 const c=QQ.c,t=QQ.t,w=t!='b';let p=t=='a'?`<div class=jp>${E(c.jp)}</div>${ST.qid?'<small>'+E(c.id)+'</small>':''}`:t=='b'?`<div style="text-align:left">${c.d.map(([s,x])=>`<div><b>${s}</b> ${E(x)}</div>`).join('')}</div>`:`<b>🎧</b><small>dengarkan can-do</small>${QQ.peek?`<div class=jp>${E(c.jp)}</div>`:''}`;
 return`<div class=bar><i style="width:${QQ.i/QQ.q.length*100}%"></i></div><div class=row><span class=soft>Soal ${QQ.i+1}/${QQ.q.length} · skor ${QQ.s}</span><button style="flex:0" data-a=quitQ>✕</button></div>${ST.qlv==3&&!QQ.lock?'<div class="bar t l"><i></i></div>':''}<div class="card big" style="min-height:110px">${p}</div><div class=row style="margin-bottom:10px">${t!='b'?'<button data-a=qsay>🔊 Ulang</button>':''}${t=='c'?'<button data-a=peek>👁 Lihat teks</button>':''}</div><div class="opts ${w?'w':''}">${QQ.o.map((o,k)=>`<button class="${QQ.lock?(o==c?'ok':k==QQ.pick?'bad':''):''}" data-a=qa data-v=${k}>${w?dl(o):E(o.jp)+(ST.qid?'<small>'+E(o.id)+'</small>':'')}</button>`).join('')}</div>`+(QQ.lock?`<div class=fbk>${QQ.o[QQ.pick]==c?'✅ Benar!':'❌ Yang benar:'} <b>No.${c.n}</b> ${E(c.id)}${c.d.map(([s,x])=>`<div><b>${s}</b> ${E(x)}</div>`).join('')}</div><button class=pri data-a=qn>Lanjut →</button>`:'')}
function setQ(){const c=QQ.q[QQ.i],t=ST.qd=='mix'?'abc'[Math.random()*3|0]:ST.qd;let d=sh(CD.filter(x=>x!=c));if(ST.qlv>1)d.sort((a,b)=>(b.b==c.b)-(a.b==c.b));QQ.c=c;QQ.t=t;QQ.o=sh([c,...d.slice(0,[0,2,3,4][ST.qlv])]);QQ.lock=0;QQ.peek=0;QQ.sp=1;clearTimeout(TM)}
function startQ(){const L=sh(cds());if(L.length<3)return alert('Pilih rentang bab lebih lebar (minimal 3 can-do).');QQ={on:1,q:L.slice(0,ST.qn),i:0,s:0};setQ();render();if(ST.qlv==3)armQ()}
const armQ=()=>{clearTimeout(TM);TM=setTimeout(()=>qa(-1),20000)};
function qa(k){if(QQ.lock)return;clearTimeout(TM);QQ.lock=1;QQ.pick=k;if(QQ.o[k]==QQ.c)QQ.s++;render()}
/* ---------- EVENTS ---------- */
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.s){const v=t.type=='checkbox'?t.checked:t.value;ST[t.dataset.s]=isNaN(v)||typeof v=='boolean'?v:+v;if(['wf','wt'].includes(t.dataset.s)){if(ST.wf>ST.wt)ST.wt=ST.wf;KW.cur=null}render()}else if(t.dataset.k){KW[t.dataset.k]=t.checked;renderRes()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,i=K.q&&K.q[K.i];
 if(a=='tab'){ST.tab=v;K={};QQ={};speechSynthesis.cancel();render()}
 else if(a=='startK')startK();else if(a=='quit'){K={};render()}
 else if(a=='redo'){startK(Object.assign([...K.w],{redo:1}))}
 else if(a=='flip'){K.f=!K.f;if(K.f&&ST.dir=='arti')say(V[i][2]);render()}
 else if(a=='hear')say(V[i][2]);else if(a=='ans')ans(+v);
 else if(a=='next')nxt();else if(a=='prev'){K.i=(K.i-1+K.q.length)%K.q.length;K.f=0;K.sp=1;render()}
 else if(a=='weak'){W.has(i)?W.delete(i):W.add(i);sv();render()}
 else if(a=='ingat')nxt();else if(a=='lupa'){K.q.splice(Math.min(K.i+4,K.q.length),0,i);W.add(i);sv();nxt()}
 else if(a=='spin')spin();else if(a=='csay')say(KW.cur.jp,{rate:v=='slow'?.55:ST.rate});
 else if(a=='all')playAll();else if(a=='ls')say(KW.cur.d[+v][1],{pitch:KW.cur.d[+v][0]=='B'?1.3:1});else if(a=='mic')mic(+v);
 else if(a=='j'){const n=parseInt(v);$('#ln'+n).className='ln '+v.slice(-1)}
 else if(a=='startQ')startQ();else if(a=='quitQ'){QQ={};clearTimeout(TM);render()}
 else if(a=='qsay')say(QQ.c.jp);else if(a=='peek'){QQ.peek=1;render()}
 else if(a=='qa')qa(+v);else if(a=='qn'){QQ.i++;if(QQ.i>=QQ.q.length)QQ.end=1;else{setQ();}render();if(ST.qlv==3&&!QQ.end)armQ()}});
render();
</script></body></html>
